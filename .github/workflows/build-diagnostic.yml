name: Build Greenman Diagnostic APK

on:
  push:
    branches:
      - android13-clean-workflow
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Create diagnostic Android project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p diag/app/src/main/java/com/greenman/diagnostic
          mkdir -p diag/app/src/main/res/values
          mkdir -p diag/app/src/main/assets

          cat > diag/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='GreenmanDiagnostic'
          include ':app'
          EOF

          cat > diag/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > diag/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.greenman.diagnostic'
            compileSdk 35
            defaultConfig {
              applicationId 'com.greenman.diagnostic'
              minSdk 29
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

          cat > diag/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">monospace</item>
              <item name="android:colorAccent">#8A6A1F</item>
            </style>
          </resources>
          EOF

          cat > diag/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Greenman Diagnostic" android:theme="@style/AppTheme" android:allowBackup="false" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > diag/app/src/main/assets/index.html <<'EOF'
          <!doctype html><html><body><h1>Placeholder</h1></body></html>
          EOF

          cat > diag/app/src/main/java/com/greenman/diagnostic/MainActivity.java <<'EOF'
          package com.greenman.diagnostic;

          import android.app.Activity;
          import android.content.pm.PackageInfo;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.webkit.JavascriptInterface;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
            private TextView status;
            private LinearLayout root;
            private WebView web;
            private static final String HOST="greenman.local";
            private static final String URL="https://greenman.local/index.html";

            @Override protected void onCreate(Bundle b) {
              installCrashRecorder();
              super.onCreate(b);
              try {
                requestWindowFeature(1);
                root=new LinearLayout(this);
                root.setOrientation(LinearLayout.VERTICAL);
                root.setBackgroundColor(Color.rgb(42,26,8));
                status=new TextView(this);
                status.setTextColor(Color.WHITE);
                status.setBackgroundColor(Color.rgb(32,20,7));
                status.setTextSize(14);
                status.setPadding(18,18,18,18);
                root.addView(status,new LinearLayout.LayoutParams(-1,-2));
                setContentView(root);
                line("GREENMAN STARTUP DIAGNOSTIC");
                showPreviousCrash();
                step("1 request/immersive shell", () -> enterImmersiveMode());
                step("2 WebView provider", () -> {
                  PackageInfo p=WebView.getCurrentWebViewPackage();
                  line("   provider="+(p==null?"NONE":p.packageName+" "+p.versionName));
                });
                step("3 create WebView", () -> {
                  web=new WebView(this);
                  web.setBackgroundColor(Color.rgb(42,26,8));
                  root.addView(web,new LinearLayout.LayoutParams(-1,0,1f));
                });
                step("4 configure WebView", () -> configure());
                step("5 load exact Greenman asset", () -> web.loadUrl(URL));
                line("Waiting for page callbacks...");
              } catch(Throwable t) { fatal("ONCREATE",t); }
            }

            private void configure() {
              WebView.setWebContentsDebuggingEnabled(false);
              WebSettings s=web.getSettings();
              step("4a JavaScript", () -> s.setJavaScriptEnabled(true));
              step("4b DOM storage", () -> s.setDomStorageEnabled(true));
              step("4c database", () -> s.setDatabaseEnabled(true));
              step("4d content/file access", () -> { s.setAllowContentAccess(true); s.setAllowFileAccess(true); });
              step("4e file URL restrictions", () -> { s.setAllowFileAccessFromFileURLs(false); s.setAllowUniversalAccessFromFileURLs(false); });
              step("4f viewport/zoom", () -> { s.setBuiltInZoomControls(false); s.setDisplayZoomControls(false); s.setSupportZoom(false); s.setUseWideViewPort(true); s.setLoadWithOverviewMode(false); });
              step("4g media/cache/mixed", () -> { s.setMediaPlaybackRequiresUserGesture(false); s.setCacheMode(WebSettings.LOAD_DEFAULT); s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW); });
              step("4h windows", () -> { s.setJavaScriptCanOpenWindowsAutomatically(false); s.setSupportMultipleWindows(false); });
              step("4i JS bridge", () -> web.addJavascriptInterface(new Bridge(),"GreenmanAndroid"));
              step("4j WebViewClient", () -> web.setWebViewClient(new Client()));
              step("4k WebChromeClient", () -> web.setWebChromeClient(new WebChromeClient()));
            }

            private class Client extends WebViewClient {
              @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                try {
                  Uri u=r.getUrl();
                  if(!HOST.equalsIgnoreCase(u.getHost())) return blocked();
                  String p=u.getPath();
                  if(p==null||p.length()==0||"/".equals(p)) p="/index.html";
                  if(p.contains("..")) return blocked();
                  String asset=p.startsWith("/")?p.substring(1):p;
                  InputStream in=getAssets().open(asset);
                  String mime=asset.endsWith(".html")?"text/html":asset.endsWith(".css")?"text/css":asset.endsWith(".js")?"application/javascript":asset.endsWith(".ttf")?"font/ttf":"application/octet-stream";
                  WebResourceResponse res=new WebResourceResponse(mime,mime.startsWith("text/")||mime.contains("javascript")?"UTF-8":null,in);
                  res.setStatusCodeAndReasonPhrase(200,"OK");
                  return res;
                } catch(Throwable t) { lineUi("ASSET ERROR: "+t); return blocked(); }
              }
              @Override public void onPageStarted(WebView v,String u,android.graphics.Bitmap f){ lineUi("PAGE STARTED: "+u); }
              @Override public void onPageFinished(WebView v,String u){ lineUi("PAGE FINISHED: "+u+"  ✅"); }
              @Override public void onReceivedError(WebView v,WebResourceRequest r,android.webkit.WebResourceError e){ lineUi("WEB ERROR: "+e); }
              @Override public boolean onRenderProcessGone(WebView v, RenderProcessGoneDetail d){ lineUi("WEBVIEW RENDER PROCESS GONE. crashed="+d.didCrash()+" priority="+d.rendererPriorityAtExit()); return true; }
            }

            private WebResourceResponse blocked(){ return new WebResourceResponse("text/plain","UTF-8",new java.io.ByteArrayInputStream("blocked".getBytes(StandardCharsets.UTF_8))); }

            private class Bridge {
              @JavascriptInterface public void showMessage(String m){ lineUi("JS MESSAGE: "+m); }
              @JavascriptInterface public void refreshImmersive(){ runOnUiThread(() -> step("JS immersive refresh", () -> enterImmersiveMode())); }
              @JavascriptInterface public void saveBase64(String n,String m,String d){ lineUi("JS saveBase64 called: "+n); }
              @JavascriptInterface public void printDocument(String h,String n){ lineUi("JS print bridge reached: "+n+" (diagnostic does not print)"); }
            }

            private void enterImmersiveMode(){
              if(Build.VERSION.SDK_INT>=30){
                WindowInsetsController c=getWindow().getInsetsController();
                if(c!=null){ c.hide(WindowInsets.Type.statusBars()|WindowInsets.Type.navigationBars()); c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE); }
              } else getWindow().getDecorView().setSystemUiVisibility(5894);
            }

            private interface Checked { void run() throws Throwable; }
            private void step(String name,Checked r){
              try { line(name+" ..."); r.run(); line(name+" OK"); }
              catch(Throwable t){ fatal(name,t); throw new RuntimeException(t); }
            }
            private void line(String s){ status.append(s+"\n"); }
            private void lineUi(String s){ runOnUiThread(() -> line(s)); }
            private void fatal(String where,Throwable t){
              StringBuilder sb=new StringBuilder(); sb.append("\n❌ FAILED AT ").append(where).append("\n").append(t.getClass().getName()).append(": ").append(t.getMessage()).append("\n");
              for(StackTraceElement e:t.getStackTrace()) sb.append("  at ").append(e.toString()).append("\n");
              line(sb.toString());
            }
            private void installCrashRecorder(){
              Thread.UncaughtExceptionHandler old=Thread.getDefaultUncaughtExceptionHandler();
              Thread.setDefaultUncaughtExceptionHandler((th,t)->{
                try(FileOutputStream o=openFileOutput("last_crash.txt",MODE_PRIVATE)){
                  StringBuilder s=new StringBuilder(); s.append(t.getClass().getName()).append(": ").append(t.getMessage()).append("\n");
                  for(StackTraceElement e:t.getStackTrace()) s.append("at ").append(e.toString()).append("\n");
                  o.write(s.toString().getBytes(StandardCharsets.UTF_8));
                }catch(Throwable ignored){}
                if(old!=null) old.uncaughtException(th,t);
              });
            }
            private void showPreviousCrash(){
              try(FileInputStream in=openFileInput("last_crash.txt")){
                byte[] b=new byte[in.available()]; in.read(b); line("PREVIOUS CRASH:\n"+new String(b,StandardCharsets.UTF_8));
                deleteFile("last_crash.txt");
              }catch(Throwable ignored){}
            }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          cd diag
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../GREENMAN_DIAGNOSTIC_SHELL.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: greenman-diagnostic-shell
          path: GREENMAN_DIAGNOSTIC_SHELL.apk
          if-no-files-found: error
