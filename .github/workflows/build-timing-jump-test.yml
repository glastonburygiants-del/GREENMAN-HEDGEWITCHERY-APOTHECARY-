name: Build Timing Jump Test APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify clean baseline files
        run: |
          set -euo pipefail
          test -s GREENMAN_HEDGEWITCHERY.apk
          test -s GREENMAN_EDITABLE_CURRENT.html
          sha256sum GREENMAN_HEDGEWITCHERY.apk GREENMAN_EDITABLE_CURRENT.html

      - name: Remove only the two automatic timing jumps
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('GREENMAN_EDITABLE_CURRENT.html')
          s=p.read_text(encoding='utf-8')
          old1="selectItem(name);jumpTo('timing')"
          new1="selectItem(name)"
          old2="switchToPhase(phase,true)"
          new2="switchToPhase(phase,false)"
          c1=s.count(old1); c2=s.count(old2)
          if c1 != 1: raise SystemExit(f'Planet timing jump signature expected once, found {c1}')
          if c2 != 1: raise SystemExit(f'Moon timing jump signature expected once, found {c2}')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          print('Changed only the two timing selection auto-jump signatures')
          PY

      - name: Repack exact current APK with edited HTML
        run: |
          set -euo pipefail
          mkdir apkwork
          cd apkwork
          unzip -q ../GREENMAN_HEDGEWITCHERY.apk
          rm -rf META-INF
          cp ../GREENMAN_EDITABLE_CURRENT.html assets/index.html
          zip -qr ../unsigned.apk .
          cd ..

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"

      - name: Sign with the same Greenman test certificate
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/glastonburygiants-del/GREENMAN-HEDGEWITCHERY-app/main/tools/greenman_debug_keystore.b64 -o key.b64
          base64 --decode key.b64 > greenman.keystore
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 unsigned.apk aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks greenman.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out GREENMAN_HEDGEWITCHERY_TIMING_NO_JUMP_TEST.apk aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs GREENMAN_HEDGEWITCHERY_TIMING_NO_JUMP_TEST.apk

      - name: Verify only app HTML differs
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile, hashlib
          a='GREENMAN_HEDGEWITCHERY.apk'; b='GREENMAN_HEDGEWITCHERY_TIMING_NO_JUMP_TEST.apk'
          def files(path):
              with zipfile.ZipFile(path) as z:
                  return {n:hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if not n.startswith('META-INF/')}
          A=files(a); B=files(b)
          diff=sorted(n for n in set(A)|set(B) if A.get(n)!=B.get(n))
          print('Non-signature differences:', diff)
          if diff != ['assets/index.html']:
              raise SystemExit('Unexpected APK content changed')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-TIMING-NO-JUMP-TEST
          path: GREENMAN_HEDGEWITCHERY_TIMING_NO_JUMP_TEST.apk
          if-no-files-found: error
          retention-days: 7
